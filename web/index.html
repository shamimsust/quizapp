<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter Exam Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Exam Platform | Admin & Candidate Portal</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed;
      /* Sexy dark ambient gradient matching your app's loading states */
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #020617 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* Premium Branding Titles */
    .app-title {
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .app-subtitle {
      color: #38bdf8; /* Vibrant neon cyan accent */
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .spinner-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 86px;
      height: 86px;
    }
    .glowing-halo {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(34, 100, 215, 0.15);
      box-shadow: 0 0 30px rgba(34, 100, 215, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }
    .loader {
      width: 52px; height: 52px;
      border: 3.5px solid rgba(56, 189, 248, 0.1);
      border-top-color: #38bdf8; /* Vibrant neon cyan accent indicator */
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .loading-text {
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="container">
    <div class="app-title">Exam Platform</div>
    <div class="app-subtitle">Assessment Engine</div>

    <div class="spinner-wrapper">
      <div class="glowing-halo"></div>
      <span class="loader"></span>
    </div>
    <div class="loading-text">Initializing Exam Environment...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // The flutter_bootstrap.js handles the engine initialization.
      // Once the first frame is rendered, the loader will be covered by the Canvas.
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
